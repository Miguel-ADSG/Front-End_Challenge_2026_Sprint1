<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="../css/main.css" />
  <script src="../js/contato.js" defer></script>
  <script src="../js/mobile.js" defer></script>
</head>

<body>
  <header class="cabecalho">

    <div id="mobileToggle" class="mobile-toggle" role="button" aria-haspopup="true" aria-expanded="false" tabindex="0">
      Menu <span class="mobile-caret">▾</span>
    </div>
    <div id="mobileDropdown" class="mobile-dropdown" aria-hidden="true">

      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="./sobre.html">Sobre</a></li>
        <li><a href="./integrantes.html">Integrantes</a></li>
        <li><a href="./faq.html">FAQ</a></li>
        <li><a href="./contato.html">Contato</a></li>
        <li><a href="./transporte.html">Converter pontos</a></li>
      </ul>
    </div>

    <a class="cabecalho__logo" href="../index.html">SoulUp | Ecoloop</a>
    <nav class="cabecalho__nav">
      <ul class="cabecalho__ul">
        <li class="cabecalho__li"><a class="cabecalho__a" href="../index.html">Home</a></li>
        <li class="cabecalho__li"><a class="cabecalho__a" href="./sobre.html">Sobre</a></li>
        <li class="cabecalho__li"><a class="cabecalho__a" href="./integrantes.html">Integrantes</a></li>
        <li class="cabecalho__li"><a class="cabecalho__a" href="./faq.html">FAQ</a></li>
        <li class="cabecalho__li"><a class="cabecalho__a cabecalho__a--active" href="./contato.html">Contato</a></li>
        <li class="cabecalho__li"><a class="cabecalho__a" href="./transporte.html">Converter pontos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero__container">
        <h1 class="hero__tit">Contato</h1>
        <p class="hero__txt">Dúvidas? Fale conosco, envie uma mensagem.</p>
      </div>
    </section>

    <section class="conteudo__contato">
      <article class="conteudo__sec">
        <form id="formContato" class="transporte__form" novalidate>
          <label for="nomeContato">Nome</label>
          <input id="nomeContato" type="text" required />

          <label for="emailContato">Email</label>
          <input id="emailContato" type="email" required />

          <label for="mensagemContato">Mensagem</label>
          <textarea id="mensagemContato" rows="5" required></textarea>

          <div class="transporte__actions">
            <button type="submit" class="hero__btn">Enviar</button>
          </div>
        </form>
      </article>
    </section>
  </main>

  <dialog id="mensagemModal" class="modal">
    <button id="fecharMensagem" aria-label="Fechar">X</button>
    <div id="mensagemContent"></div>
  </dialog>


  <footer class="footer">
    <p>&copy; SoulUp — Ecoloop 2026</p>
  </footer>
</body>

</html>
